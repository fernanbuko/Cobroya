<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>CobraYa — Registro de cobros</title>
<meta name="description" content="Registra y controla los cobros de tus clientes." />
<meta name="theme-color" content="#3D6B5C" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root{
    --bg:#F7F4EC;
    --paper:#FFFFFF;
    --border:#DDD5C4;
    --ink:#23342F;
    --muted:#6B7A72;
    --faint:#A6A08F;
    --green:#3D6B5C;
    --green-dark:#2F5548;
    --green-bg:#EAF0EC;
    --orange:#B14E1C;
    --orange-soft:#E08A3E;
    --orange-bg:#FBEADD;
    --danger:#B14E1C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }
  .display{font-family:'Fraunces',serif}
  .mono{font-family:'IBM Plex Mono',monospace}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}

  header.topbar{
    background:var(--green);
    color:#fff;
    padding:18px 16px 16px 20px;
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  header.topbar .brand-btn{
    display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;
    color:inherit;text-align:left;cursor:pointer;
  }
  header.topbar .brand-btn .logo{font-size:22px}
  header.topbar h1{font-size:20px;margin:0;font-weight:600;}
  header.topbar .sub{font-size:12px;opacity:.85;margin-top:2px}
  .settings-btn{
    background:none;border:none;color:#fff;font-size:22px;line-height:1;
    padding:8px;border-radius:8px;flex-shrink:0;
  }
  .settings-btn:hover{background:rgba(255,255,255,.15)}
  .settings-btn.active{background:rgba(255,255,255,.22)}
  .filter-select{
    width:100%;background:#fff;border:1px solid var(--border);color:var(--ink);
    border-radius:8px;padding:9px 10px;font-size:14px;
  }

  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;background:var(--paper);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;padding:9px 4px 8px;color:var(--muted);
  }
  .bottom-nav button .bn-icon{font-size:20px;line-height:1}
  .bottom-nav button .bn-label{font-size:10.5px;font-weight:500}
  .bottom-nav button.active{color:var(--green)}

  main{max-width:760px;margin:0 auto;padding:20px 16px 40px}

  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:14px}.mb-4{margin-bottom:20px}
  .mt-2{margin-top:8px}.mt-3{margin-top:14px}

  h2.section-title{font-size:20px;margin:0 0 4px;font-weight:600}
  p.section-sub{font-size:13px;color:var(--muted);margin:0 0 18px}

  .cards-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{
    background:var(--paper);border:1px solid var(--border);border-radius:10px;
    padding:14px;text-align:center;
  }
  .stat-card .val{font-size:19px;font-weight:600}
  .stat-card .val.green{color:var(--green)}
  .stat-card .val.orange{color:var(--orange)}
  .stat-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}

  .btn{
    display:inline-flex;align-items:center;gap:7px;border-radius:8px;
    font-size:14px;font-weight:500;padding:10px 15px;border:1px solid transparent;
  }
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-dark)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:none;border-color:var(--border);color:var(--ink)}
  .btn-ghost:hover{background:#fff}
  .btn-danger{background:none;border-color:rgba(177,78,28,.35);color:var(--orange)}
  .btn-danger:hover{background:var(--orange-bg)}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
  .icon-btn{background:none;border:none;color:var(--faint);font-size:15px;padding:2px 4px}
  .icon-btn:hover{color:var(--green)}
  .icon-btn.danger:hover{color:var(--orange)}

  .card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:16px}
  .list{display:flex;flex-direction:column;gap:10px}

  .empty{
    border:1px dashed var(--border);border-radius:10px;padding:44px 20px;text-align:center;
  }
  .empty .emo{font-size:28px;margin-bottom:8px}
  .empty .t{font-family:'Fraunces',serif;font-size:17px;font-weight:500}
  .empty .s{font-size:13px;color:var(--muted);margin-top:4px}

  .field{display:block;margin-bottom:14px}
  .field .label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
  .field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field select,.field textarea{
    width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:10px 11px;font-size:15px;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
  .checkbox-row{display:flex;align-items:center;gap:9px;margin-bottom:12px;cursor:pointer;user-select:none;font-size:14px}
  .checkbox-row input{width:16px;height:16px;accent-color:var(--green)}

  .pill{
    display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;
    border:1px solid var(--border);font-size:13px;background:none;color:var(--ink);
  }
  .pill.active{background:var(--green);border-color:var(--green);color:#fff}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px}

  .badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:5px}
  .badge.pagado{background:var(--green-bg);color:var(--green)}
  .badge.pendiente{background:var(--orange-bg);color:var(--orange)}

  .entry-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .entry-name{font-weight:600;font-size:15px}
  .entry-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .entry-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .entry-amount{font-weight:600;font-size:15px}
  .entry-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}

  footer.hint{max-width:760px;margin:8px auto 0;padding:0 16px;font-size:12px;color:var(--faint)}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(35,52,47,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;padding:0;
  }
  @media (min-width:640px){.modal-overlay{align-items:center;padding:20px}}
  .modal{
    background:var(--paper);width:100%;max-width:480px;border-radius:16px 16px 0 0;
    padding:22px 20px 26px;max-height:88vh;overflow-y:auto;
  }
  @media (min-width:640px){.modal{border-radius:14px}}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;
    z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .2s,transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1}

  .danger-zone{border:1px solid rgba(177,78,28,.3);border-radius:10px;padding:16px;background:var(--orange-bg)}

  .onboarding-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px 16px;background:var(--green);
  }
  .onboarding-card{
    background:var(--paper);border-radius:16px;padding:28px 24px;max-width:400px;width:100%;
    box-shadow:0 12px 32px rgba(0,0,0,.18);
  }

  .fab{
    position:fixed;right:20px;bottom:78px;width:58px;height:58px;border-radius:50%;
    background:var(--green);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(35,52,47,.35);z-index:40;
  }
  .fab:hover{background:var(--green-dark)}
  .fab:active{transform:scale(.96)}
  .fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none}

  ::placeholder{color:var(--faint)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------
     Almacenamiento (localStorage, sin backend)
  ----------------------------------------------------------*/
  var STORAGE_KEY = "cobraya:data:v1";

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }
  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function saludoSegunHora() {
    // new Date().getHours() usa la hora local del dispositivo (su propia
    // zona horaria), así que si se abre desde otro país saluda según la
    // hora de ese lugar, no la de donde se creó la cuenta.
    var hora = new Date().getHours();
    if (hora >= 5 && hora < 12) return "Buenos días";
    if (hora >= 12 && hora < 19) return "Buenas tardes";
    return "Buenas noches";
  }
  function formatDate(iso) {
    if (!iso) return "";
    var parts = iso.split("-");
    if (parts.length !== 3) return iso;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function money(n) {
    var v = parseFloat(n);
    if (isNaN(v)) v = 0;
    return "$" + v.toFixed(2);
  }
  function esc(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function onlyDigits(str) {
    return String(str || "").replace(/[^0-9]/g, "");
  }
  function whatsappLink(telefono, mensaje) {
    var num = onlyDigits(telefono);
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(mensaje);
  }

  function defaultData() {
    return { propietario: "", negocio: "", onboardingDone: false, clientes: [], cobros: [], cuentaBancaria: "" };
  }
  function cuentaBancariaComoTexto(cuentaVieja) {
    var lineas = [];
    if (cuentaVieja.banco) lineas.push("Banco: " + cuentaVieja.banco);
    if (cuentaVieja.tipoCuenta) lineas.push("Tipo de cuenta: " + cuentaVieja.tipoCuenta);
    if (cuentaVieja.numeroCuenta) lineas.push("Número de cuenta: " + cuentaVieja.numeroCuenta);
    if (cuentaVieja.titular) lineas.push("Titular: " + cuentaVieja.titular);
    if (cuentaVieja.identificacion) lineas.push("Cédula/RUC: " + cuentaVieja.identificacion);
    return lineas.join("\n");
  }
  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      var parsed = JSON.parse(raw);
      var clientes = Array.isArray(parsed.clientes) ? parsed.clientes : [];
      // Versiones anteriores guardaban la cuenta como varios campos sueltos
      // (banco, número, titular...); se convierten a un solo texto para no
      // perder lo que la persona ya había cargado.
      var cuentaBancaria = typeof parsed.cuentaBancaria === "string" ? parsed.cuentaBancaria :
        (parsed.cuentaBancaria && typeof parsed.cuentaBancaria === "object" ? cuentaBancariaComoTexto(parsed.cuentaBancaria) : "");
      return {
        propietario: parsed.propietario || "",
        negocio: parsed.negocio || "",
        // Los respaldos o datos de antes de que existiera esta pantalla no
        // traen esta bandera: si ya tenían clientes cargados, se asume que
        // el negocio ya quedó configurado y no hay que volver a preguntar.
        onboardingDone: typeof parsed.onboardingDone === "boolean" ? parsed.onboardingDone : clientes.length > 0,
        clientes: clientes,
        cobros: Array.isArray(parsed.cobros) ? parsed.cobros : [],
        cuentaBancaria: cuentaBancaria
      };
    } catch (e) {
      return defaultData();
    }
  }
  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  var data = loadData();

  /* ---------------------------------------------------------
     Estado de la interfaz
  ----------------------------------------------------------*/
  var state = {
    vista: "resumen",    // resumen | clientes | cobros | ajustes
    modal: null,         // {type, payload}
    clienteFiltroCobros: "todos"
  };

  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      el.classList.remove("show");
    }, 2200);
  }

  /* ---------------------------------------------------------
     Helpers de datos
  ----------------------------------------------------------*/
  function clienteById(id) {
    return data.clientes.find(function (c) { return c.id === id; });
  }
  function cobrosFiltrados() {
    var list = data.cobros.slice();
    if (state.vista === "cobros" && state.clienteFiltroCobros !== "todos") {
      list = list.filter(function (c) { return c.clienteId === state.clienteFiltroCobros; });
    }
    list.sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });
    return list;
  }
  function totales(list) {
    var total = 0, pendiente = 0;
    list.forEach(function (c) {
      var m = parseFloat(c.monto) || 0;
      total += m;
      if (!c.pagado) pendiente += m;
    });
    return { total: total, pendiente: pendiente };
  }

  /* ---------------------------------------------------------
     Render
  ----------------------------------------------------------*/
  function render() {
    var app = document.getElementById("app");
    if (!data.onboardingDone) {
      app.innerHTML = renderOnboarding();
      return;
    }
    app.innerHTML = renderHeader() + "<main>" + renderVista() + "</main>" + renderFab() + renderBottomNav() + renderModal();
  }

  function renderFab() {
    return '<button class="fab" data-action="agregar-rapido" title="Agregar cliente y cobro" aria-label="Agregar cliente y cobro">' +
      '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
    "</button>";
  }

  function renderOnboarding() {
    return (
      '<div class="onboarding-screen"><div class="onboarding-card">' +
        '<div style="font-size:32px;margin-bottom:6px">💰</div>' +
        '<h1 class="display" style="font-size:22px;margin:0 0 4px">¡Bienvenido a CobraYa!</h1>' +
        '<p style="font-size:13px;color:var(--muted);margin:0 0 20px">Antes de empezar, cuéntanos quién eres y el nombre de tu negocio. Podrás editar estos datos después en Ajustes.</p>' +
        '<div class="field"><span class="label">Nombre del dueño/a</span><input type="text" id="obPropietario" placeholder="Ej. María Torres" /></div>' +
        '<div class="field"><span class="label">Nombre del negocio</span><input type="text" id="obNegocio" placeholder="Ej. Mi negocio" /></div>' +
        '<button class="btn btn-primary" style="width:100%;justify-content:center" data-action="completar-onboarding">Comenzar</button>' +
      "</div></div>"
    );
  }

  function renderHeader() {
    return (
      '<header class="topbar">' +
        '<button class="brand-btn" data-vista="resumen" aria-label="Ir a Resumen">' +
          '<span class="logo">💰</span><div>' +
            '<h1 class="display">CobraYa</h1>' +
            '<div class="sub">' + esc(data.negocio || "Registro de cobros") + "</div>" +
          "</div>" +
        "</button>" +
        '<button class="settings-btn' + (state.vista === "ajustes" ? " active" : "") + '" data-vista="ajustes" aria-label="Ajustes" title="Ajustes">⚙️</button>' +
      "</header>"
    );
  }

  var TABS = [
    { key: "resumen", label: "Resumen", icon: "🏠" },
    { key: "clientes", label: "Clientes", icon: "👥" },
    { key: "cobros", label: "Cobros", icon: "💵" },
    { key: "cuenta", label: "Cuenta", icon: "🏦" }
  ];
  function renderBottomNav() {
    return (
      "<nav class=\"bottom-nav\">" +
      TABS.map(function (t) {
        return '<button data-vista="' + t.key + '" class="' + (state.vista === t.key ? "active" : "") + '">' +
          '<span class="bn-icon">' + t.icon + '</span><span class="bn-label">' + t.label + "</span>" +
        "</button>";
      }).join("") +
      "</nav>"
    );
  }

  function renderVista() {
    if (state.vista === "clientes") return renderClientes();
    if (state.vista === "cobros") return renderCobros();
    if (state.vista === "cuenta") return renderCuenta();
    if (state.vista === "ajustes") return renderAjustes();
    return renderResumen();
  }

  /* --- Cuenta bancaria --- */
  function renderCuenta() {
    var texto = data.cuentaBancaria;
    var html = "";
    html += '<h2 class="section-title display">Cuenta bancaria</h2>';
    html += '<p class="section-sub">Pega aquí los datos tal como te los da el banco, para compartirlos rápido por WhatsApp.</p>';

    html += '<div class="card mb-4">' +
      '<div class="field mb-2">' +
        '<textarea id="fCuentaTexto" rows="6" placeholder="Ej.\nBanco Pichincha\nCuenta de ahorros N.° 2210012345\nFernando Tapia\nCI 1712345678">' + esc(texto) + "</textarea>" +
      "</div>" +
      '<button class="btn btn-primary btn-sm" data-action="guardar-cuenta">Guardar</button>' +
    "</div>";

    if (texto.trim()) {
      html += '<div class="card mb-4">' +
        '<div class="entry-name mb-2">Vista previa</div>' +
        '<div style="font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap">' + esc(texto) + "</div>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">' +
          '<button class="btn btn-primary btn-sm" data-action="compartir-cuenta">📲 Compartir por WhatsApp</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="copiar-cuenta">📋 Copiar</button>' +
        "</div>" +
      "</div>";
    } else {
      html += emptyState("🏦", "Sin datos guardados", "Pega los datos que te dio el banco para poder compartirlos.");
    }
    return html;
  }

  /* --- Resumen --- */
  function renderResumen() {
    var list = cobrosFiltrados();
    var t = totales(list);
    var pendientes = list.filter(function (c) { return !c.pagado; });
    var html = "";
    html += '<p style="font-size:13px;color:var(--muted);margin:0 0 4px">' + saludoSegunHora() + (data.propietario ? ", " + esc(data.propietario) : "") + " 👋</p>";
    html += '<h2 class="section-title display">Resumen</h2>';
    html += '<div class="cards-2 mb-4">' +
      '<div class="stat-card"><div class="val green">' + money(t.total) + '</div><div class="lbl">Total cobrado</div></div>' +
      '<div class="stat-card"><div class="val orange">' + money(t.pendiente) + '</div><div class="lbl">Pendiente de pago</div></div>' +
    "</div>";

    html += '<div class="row-between mb-3"><h3 class="display" style="font-size:16px;margin:0">Pendientes de cobro</h3></div>';

    if (pendientes.length === 0) {
      html += emptyState("🎉", "Sin pendientes", "No hay cobros pendientes de pago en esta selección.");
    } else {
      html += '<div class="list">' + pendientes.map(renderCobroCard).join("") + "</div>";
    }
    return html;
  }

  function emptyState(emo, title, sub) {
    return '<div class="empty"><div class="emo">' + emo + '</div><div class="t display">' + esc(title) + '</div><div class="s">' + esc(sub) + "</div></div>";
  }

  /* --- Clientes --- */
  function renderClientes() {
    var list = data.clientes.slice().sort(function (a, b) { return (a.nombre || "").localeCompare(b.nombre || ""); });
    var html = "";
    html += '<div class="row-between mb-1"><h2 class="section-title display">Clientes</h2></div>';
    html += '<p class="section-sub">Los clientes de tu negocio.</p>';
    html += '<div class="mb-4">' +
      '<button class="btn btn-primary" data-action="nuevo-cliente">➕ Nuevo cliente</button>' +
    "</div>";
    if (list.length === 0) {
      html += emptyState("👤", "Sin clientes", "Los clientes que agregues aparecerán aquí.");
      return html;
    }
    html += '<div class="list">' + list.map(renderClienteCard).join("") + "</div>";
    return html;
  }

  function renderClienteCard(c) {
    var cobrosCliente = data.cobros.filter(function (x) { return x.clienteId === c.id; });
    var t = totales(cobrosCliente);
    return (
      '<div class="card">' +
        '<div class="entry-top">' +
          '<div class="min-w-0">' +
            '<div class="entry-name">' + esc(c.nombre) + "</div>" +
            (c.telefono ? '<div class="entry-meta">' + esc(c.telefono) + "</div>" : "") +
          "</div>" +
          '<div class="entry-actions">' +
            '<button class="icon-btn" data-action="editar-cliente" data-id="' + c.id + '" title="Editar">✎</button>' +
            '<button class="icon-btn danger" data-action="eliminar-cliente" data-id="' + c.id + '" title="Eliminar">🗑</button>' +
          "</div>" +
        "</div>" +
        '<div class="entry-bottom">' +
          '<span class="badge ' + (t.pendiente > 0 ? "pendiente" : "pagado") + '">' + (t.pendiente > 0 ? "Debe " + money(t.pendiente) : "Al día") + "</span>" +
          '<button class="btn btn-ghost btn-sm" data-action="ver-cobros-cliente" data-id="' + c.id + '">Ver cobros</button>' +
        "</div>" +
      "</div>"
    );
  }

  /* --- Cobros --- */
  function renderCobros() {
    var list = cobrosFiltrados();
    var html = "";
    html += '<div class="row-between mb-1"><h2 class="section-title display">Cobros</h2></div>';
    html += '<p class="section-sub">Todos los cobros registrados.</p>';

    var filtroOptions = '<option value="todos">Todos los clientes</option>' +
      data.clientes.map(function (c) {
        return '<option value="' + c.id + '"' + (state.clienteFiltroCobros === c.id ? " selected" : "") + '>' + esc(c.nombre) + "</option>";
      }).join("");
    html += '<div class="mb-3"><select class="filter-select" id="selClienteFiltro">' + filtroOptions + "</select></div>";

    html += '<div class="mb-4"><button class="btn btn-primary" data-action="nuevo-cobro" ' + (data.clientes.length === 0 ? "disabled" : "") + ">💰 Registrar cobro</button></div>";

    if (data.clientes.length === 0) {
      html += emptyState("👤", "Primero agrega un cliente", "Ve a la pestaña Clientes para crear el primero.");
      return html;
    }
    if (list.length === 0) {
      html += emptyState("💵", "Sin cobros registrados", "Los cobros que registres aparecerán aquí.");
      return html;
    }
    html += '<div class="list">' + list.map(renderCobroCard).join("") + "</div>";
    return html;
  }

  function renderCobroCard(c) {
    var cliente = clienteById(c.clienteId);
    var nombreCliente = cliente ? cliente.nombre : "(cliente eliminado)";
    var telefono = cliente ? cliente.telefono : "";
    return (
      '<div class="card">' +
        '<div class="entry-top">' +
          '<div class="min-w-0">' +
            '<div class="entry-name">' + esc(nombreCliente) + "</div>" +
            '<div class="entry-meta">' + esc(c.concepto) + "</div>" +
            '<div class="entry-meta mono">' + formatDate(c.fecha) + "</div>" +
          "</div>" +
          '<div class="entry-actions">' +
            '<span class="entry-amount">' + money(c.monto) + "</span>" +
            '<button class="icon-btn" data-action="editar-cobro" data-id="' + c.id + '" title="Editar">✎</button>' +
            '<button class="icon-btn danger" data-action="eliminar-cobro" data-id="' + c.id + '" title="Eliminar">🗑</button>' +
          "</div>" +
        "</div>" +
        '<div class="entry-bottom">' +
          '<span class="badge ' + (c.pagado ? "pagado" : "pendiente") + '">' + (c.pagado ? "✓ Pagado" : "Pendiente") + "</span>" +
          (!c.pagado ? '<div style="display:flex;gap:8px">' +
            '<button class="btn btn-ghost btn-sm" data-action="marcar-pagado" data-id="' + c.id + '">Marcar pagado</button>' +
            (telefono ? '<button class="btn btn-ghost btn-sm" data-action="cobrar-whatsapp" data-id="' + c.id + '">📲 WhatsApp</button>' : "") +
          "</div>" : "") +
        "</div>" +
      "</div>"
    );
  }

  /* --- Ajustes --- */
  function renderAjustes() {
    var html = "";
    html += '<h2 class="section-title display">Ajustes</h2>';
    html += '<p class="section-sub">Configura tu negocio y tus respaldos.</p>';

    html += '<div class="card mb-4">' +
      '<div class="field mb-2"><span class="label">Nombre del dueño/a</span>' +
        '<input type="text" id="inpPropietario" value="' + esc(data.propietario) + '" placeholder="Ej. María Torres" /></div>' +
      '<div class="field mb-2"><span class="label">Nombre del negocio</span>' +
        '<input type="text" id="inpNegocio" value="' + esc(data.negocio) + '" placeholder="Ej. Mi negocio" /></div>' +
      '<button class="btn btn-ghost btn-sm" data-action="guardar-negocio">Guardar</button>' +
      '<p style="font-size:12px;color:var(--muted);margin-top:8px">El nombre del negocio se usa en los mensajes de cobro por WhatsApp.</p>' +
    "</div>";

    html += '<div class="row-between mb-2"><h3 class="display" style="font-size:16px;margin:0">Respaldo</h3></div>';
    html += '<div class="card mb-4">' +
      '<p style="font-size:13px;color:var(--muted);margin:0 0 12px">Tus datos se guardan solo en este dispositivo/navegador. Descarga un respaldo para no perderlos o para pasarlos a otro dispositivo.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost btn-sm" data-action="exportar">⬇️ Descargar respaldo</button>' +
        '<label class="btn btn-ghost btn-sm" style="margin:0">⬆️ Restaurar respaldo<input type="file" accept="application/json" id="inpImportar" style="display:none" /></label>' +
      "</div>" +
    "</div>";

    html += '<div class="danger-zone">' +
      '<div class="entry-name" style="color:var(--orange)">Borrar todos los datos</div>' +
      '<p style="font-size:13px;color:var(--muted);margin:6px 0 10px">Elimina clientes y cobros de este dispositivo. No se puede deshacer.</p>' +
      '<button class="btn btn-danger btn-sm" data-action="borrar-todo">Borrar todo</button>' +
    "</div>";

    return html;
  }

  /* ---------------------------------------------------------
     Modales (formularios)
  ----------------------------------------------------------*/
  function renderModal() {
    if (!state.modal) return "";
    var m = state.modal;
    var body = "";
    if (m.type === "cliente") body = modalClienteForm(m.payload);
    else if (m.type === "cobro") body = modalCobroForm(m.payload);
    else if (m.type === "rapido") body = modalRapidoForm();
    return '<div class="modal-overlay" id="modalOverlay"><div class="modal">' + body + "</div></div>";
  }

  function modalRapidoForm() {
    return (
      '<h3 class="display mb-3" style="font-size:18px">Agregar cliente y cobro</h3>' +
      '<div class="field"><span class="label">Nombre del cliente</span><input type="text" id="fRapidoNombre" placeholder="Nombre completo" /></div>' +
      '<div class="field"><span class="label">Teléfono (opcional, para WhatsApp)</span><input type="tel" id="fRapidoTelefono" placeholder="Ej. 0991234567" /></div>' +
      '<div class="field"><span class="label">Descripción del cobro</span><input type="text" id="fRapidoConcepto" placeholder="Ej. Servicio, producto, cuota..." /></div>' +
      '<div class="field"><span class="label">Monto</span><input type="number" step="0.01" min="0" id="fRapidoMonto" placeholder="Ej. 25.00" /></div>' +
      '<label class="checkbox-row"><input type="checkbox" id="fRapidoPagado" /> Ya está pagado</label>' +
      '<div style="display:flex;gap:8px;margin-top:6px">' +
        '<button class="btn btn-primary" data-action="guardar-rapido">Guardar</button>' +
        '<button class="btn btn-ghost" data-action="cerrar-modal">Cancelar</button>' +
      "</div>"
    );
  }

  function modalClienteForm(payload) {
    var editing = payload && payload.id;
    var nombre = payload ? payload.nombre : "";
    var telefono = payload ? payload.telefono : "";
    return (
      '<h3 class="display mb-3" style="font-size:18px">' + (editing ? "Editar cliente" : "Nuevo cliente") + "</h3>" +
      '<div class="field"><span class="label">Nombre del cliente</span><input type="text" id="fClienteNombre" value="' + esc(nombre) + '" placeholder="Nombre completo" /></div>' +
      '<div class="field"><span class="label">Teléfono (opcional, para WhatsApp)</span><input type="tel" id="fClienteTelefono" value="' + esc(telefono) + '" placeholder="Ej. 0991234567" /></div>' +
      '<div style="display:flex;gap:8px;margin-top:6px">' +
        '<button class="btn btn-primary" data-action="guardar-cliente" data-id="' + (editing || "") + '">Guardar</button>' +
        '<button class="btn btn-ghost" data-action="cerrar-modal">Cancelar</button>' +
      "</div>"
    );
  }

  function modalCobroForm(payload) {
    var editing = payload && payload.id;
    var clienteId = payload ? payload.clienteId : (state.clienteFiltroCobros !== "todos" ? state.clienteFiltroCobros : "");
    var concepto = payload ? payload.concepto : "";
    var monto = payload ? payload.monto : "";
    var pagado = payload ? !!payload.pagado : true;
    var clientesOptions = data.clientes.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === clienteId ? " selected" : "") + '>' + esc(c.nombre) + "</option>";
    }).join("");
    return (
      '<h3 class="display mb-3" style="font-size:18px">' + (editing ? "Editar cobro" : "Registrar cobro") + "</h3>" +
      '<div class="field"><span class="label">Cliente</span><select id="fCobroCliente"><option value="">Selecciona un cliente</option>' + clientesOptions + "</select></div>" +
      '<div class="field"><span class="label">Concepto</span><input type="text" id="fCobroConcepto" value="' + esc(concepto) + '" placeholder="Ej. Servicio, producto, cuota..." /></div>' +
      '<div class="field"><span class="label">Monto</span><input type="number" step="0.01" min="0" id="fCobroMonto" value="' + esc(monto) + '" placeholder="Ej. 25.00" /></div>' +
      '<label class="checkbox-row"><input type="checkbox" id="fCobroPagado" ' + (pagado ? "checked" : "") + " /> Ya está pagado</label>" +
      '<div style="display:flex;gap:8px;margin-top:6px">' +
        '<button class="btn btn-primary" data-action="guardar-cobro" data-id="' + (editing || "") + '">Guardar</button>' +
        '<button class="btn btn-ghost" data-action="cerrar-modal">Cancelar</button>' +
      "</div>"
    );
  }

  /* ---------------------------------------------------------
     Acciones
  ----------------------------------------------------------*/
  function abrirModal(type, payload) {
    state.modal = { type: type, payload: payload || null };
    render();
  }
  function cerrarModal() {
    state.modal = null;
    render();
  }

  function completarOnboarding() {
    var propietario = document.getElementById("obPropietario").value.trim();
    var negocio = document.getElementById("obNegocio").value.trim();
    if (!propietario || !negocio) {
      showToast("Completa tu nombre y el de tu negocio para continuar.");
      return;
    }
    data.propietario = propietario;
    data.negocio = negocio;
    data.onboardingDone = true;
    saveData();
    showToast("¡Todo listo!");
    render();
  }

  function guardarRapido() {
    var nombre = document.getElementById("fRapidoNombre").value.trim();
    var telefono = document.getElementById("fRapidoTelefono").value.trim();
    var concepto = document.getElementById("fRapidoConcepto").value.trim();
    var monto = document.getElementById("fRapidoMonto").value;
    var pagado = document.getElementById("fRapidoPagado").checked;
    if (!nombre || !concepto || !monto) {
      showToast("Completa el nombre del cliente, la descripción y el monto.");
      return;
    }
    var cliente = { id: uid(), nombre: nombre, telefono: telefono };
    data.clientes.push(cliente);
    data.cobros.push({
      id: uid(),
      clienteId: cliente.id,
      concepto: concepto,
      monto: monto,
      pagado: pagado,
      fecha: todayISO()
    });
    saveData();
    showToast("Cliente y cobro registrados");
    cerrarModal();
  }

  function guardarCliente(id) {
    var nombre = document.getElementById("fClienteNombre").value.trim();
    var telefono = document.getElementById("fClienteTelefono").value.trim();
    if (!nombre) return;
    if (id) {
      var c = clienteById(id);
      if (c) { c.nombre = nombre; c.telefono = telefono; }
      showToast("Cliente actualizado");
    } else {
      data.clientes.push({ id: uid(), nombre: nombre, telefono: telefono });
      showToast("Cliente agregado");
    }
    saveData();
    cerrarModal();
  }

  function eliminarCliente(id) {
    var c = clienteById(id);
    if (!c) return;
    var tieneCobros = data.cobros.some(function (x) { return x.clienteId === id; });
    var msg = '¿Eliminar a "' + c.nombre + '"?' + (tieneCobros ? " También se eliminarán sus cobros registrados." : "");
    if (!confirm(msg)) return;
    data.clientes = data.clientes.filter(function (x) { return x.id !== id; });
    data.cobros = data.cobros.filter(function (x) { return x.clienteId !== id; });
    saveData();
    showToast("Cliente eliminado");
    render();
  }

  function guardarCobro(id) {
    var clienteId = document.getElementById("fCobroCliente").value;
    var concepto = document.getElementById("fCobroConcepto").value.trim();
    var monto = document.getElementById("fCobroMonto").value;
    var pagado = document.getElementById("fCobroPagado").checked;
    if (!clienteId || !concepto || !monto) return;
    if (id) {
      var existing = data.cobros.find(function (x) { return x.id === id; });
      if (existing) {
        existing.clienteId = clienteId;
        existing.concepto = concepto;
        existing.monto = monto;
        existing.pagado = pagado;
      }
      showToast("Cobro actualizado");
    } else {
      data.cobros.push({
        id: uid(),
        clienteId: clienteId,
        concepto: concepto,
        monto: monto,
        pagado: pagado,
        fecha: todayISO()
      });
      showToast("Cobro registrado");
    }
    saveData();
    cerrarModal();
  }

  function eliminarCobro(id) {
    if (!confirm("¿Eliminar este cobro?")) return;
    data.cobros = data.cobros.filter(function (x) { return x.id !== id; });
    saveData();
    showToast("Cobro eliminado");
    render();
  }

  function marcarPagado(id) {
    var c = data.cobros.find(function (x) { return x.id === id; });
    if (!c) return;
    c.pagado = true;
    saveData();
    showToast("Marcado como pagado");
    render();
  }

  function cobrarWhatsApp(id) {
    var c = data.cobros.find(function (x) { return x.id === id; });
    if (!c) return;
    var cliente = clienteById(c.clienteId);
    if (!cliente || !cliente.telefono) return;
    var negocio = data.negocio || "nuestro negocio";
    var mensaje = "Hola" + (cliente.nombre ? " " + cliente.nombre : "") + ", le escribimos de " + negocio +
      " sobre un saldo pendiente:\n\n• " + c.concepto + " (" + formatDate(c.fecha) + "): " + money(c.monto) +
      "\n\nQuedamos atentos para coordinar el pago. ¡Gracias!";
    window.open(whatsappLink(cliente.telefono, mensaje), "_blank");
  }

  function guardarCuenta() {
    data.cuentaBancaria = document.getElementById("fCuentaTexto").value.trim();
    saveData();
    showToast("Datos de la cuenta guardados");
    render();
  }

  function compartirCuenta() {
    window.open(whatsappLink("", data.cuentaBancaria), "_blank");
  }

  function copiarCuenta() {
    var texto = data.cuentaBancaria;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () {
        showToast("Copiado al portapapeles");
      }, function () {
        showToast("No se pudo copiar");
      });
    } else {
      showToast("No se pudo copiar");
    }
  }

  function guardarNegocio() {
    data.propietario = document.getElementById("inpPropietario").value.trim();
    data.negocio = document.getElementById("inpNegocio").value.trim();
    saveData();
    showToast("Guardado");
  }

  function exportarRespaldo() {
    var backup = { app: "CobraYa", version: 1, exportedAt: new Date().toISOString(), data: data };
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "cobraya-respaldo-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Respaldo descargado");
  }

  function importarRespaldo(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var parsed = JSON.parse(e.target.result);
        var incoming = parsed && parsed.data ? parsed.data : parsed;
        if (!incoming || typeof incoming !== "object") throw new Error("formato inválido");
        if (!confirm("Esto reemplazará todos los datos actuales de este dispositivo por los del respaldo. ¿Continuar?")) return;
        var clientesImportados = Array.isArray(incoming.clientes) ? incoming.clientes : [];
        var cuentaBancariaImportada = typeof incoming.cuentaBancaria === "string" ? incoming.cuentaBancaria :
          (incoming.cuentaBancaria && typeof incoming.cuentaBancaria === "object" ? cuentaBancariaComoTexto(incoming.cuentaBancaria) : "");
        data = {
          propietario: incoming.propietario || "",
          negocio: incoming.negocio || "",
          onboardingDone: typeof incoming.onboardingDone === "boolean" ? incoming.onboardingDone : clientesImportados.length > 0,
          clientes: clientesImportados,
          cobros: Array.isArray(incoming.cobros) ? incoming.cobros : [],
          cuentaBancaria: cuentaBancariaImportada
        };
        saveData();
        showToast("Respaldo restaurado");
        render();
      } catch (err) {
        showToast("No se pudo leer el archivo. Asegúrate de que sea un respaldo válido de CobraYa (.json).");
      }
    };
    reader.readAsText(file);
  }

  function borrarTodo() {
    if (!confirm("Esto borrará TODOS los clientes y cobros de este dispositivo. Esta acción no se puede deshacer. ¿Continuar?")) return;
    data = defaultData();
    saveData();
    showToast("Datos borrados");
    render();
  }

  /* ---------------------------------------------------------
     Eventos (delegados una sola vez sobre document, para que
     sobrevivan a los re-renders que reemplazan el innerHTML)
  ----------------------------------------------------------*/
  function setupGlobalEvents() {
    document.addEventListener("change", function (e) {
      if (e.target.id === "selClienteFiltro") {
        state.clienteFiltroCobros = e.target.value;
        render();
      } else if (e.target.id === "inpImportar") {
        if (e.target.files && e.target.files[0]) importarRespaldo(e.target.files[0]);
      }
    });

    document.addEventListener("click", function (e) {
      var overlay = document.getElementById("modalOverlay");
      if (overlay && e.target === overlay) {
        cerrarModal();
        return;
      }

      var tabBtn = e.target.closest("[data-vista]");
      if (tabBtn) {
        state.vista = tabBtn.getAttribute("data-vista");
        if (state.vista === "cobros") state.clienteFiltroCobros = "todos";
        render();
        return;
      }

      var el = e.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      var id = el.getAttribute("data-id");

      if (action === "completar-onboarding") completarOnboarding();
      else if (action === "cerrar-modal") cerrarModal();

      else if (action === "agregar-rapido") abrirModal("rapido", null);
      else if (action === "guardar-rapido") guardarRapido();
      else if (action === "nuevo-cliente") abrirModal("cliente", null);
      else if (action === "editar-cliente") abrirModal("cliente", clienteById(id));
      else if (action === "guardar-cliente") guardarCliente(id || null);
      else if (action === "eliminar-cliente") eliminarCliente(id);
      else if (action === "ver-cobros-cliente") {
        state.vista = "cobros";
        state.clienteFiltroCobros = id;
        render();
      }

      else if (action === "nuevo-cobro") abrirModal("cobro", null);
      else if (action === "editar-cobro") abrirModal("cobro", data.cobros.find(function (x) { return x.id === id; }));
      else if (action === "guardar-cobro") guardarCobro(id || null);
      else if (action === "eliminar-cobro") eliminarCobro(id);
      else if (action === "marcar-pagado") marcarPagado(id);
      else if (action === "cobrar-whatsapp") cobrarWhatsApp(id);

      else if (action === "guardar-negocio") guardarNegocio();
      else if (action === "guardar-cuenta") guardarCuenta();
      else if (action === "compartir-cuenta") compartirCuenta();
      else if (action === "copiar-cuenta") copiarCuenta();
      else if (action === "exportar") exportarRespaldo();
      else if (action === "borrar-todo") borrarTodo();
    });
  }

  setupGlobalEvents();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
